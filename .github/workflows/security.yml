name: Security

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    name: Dependency & license scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
        with:
          turbo-cache-key: security

      - name: pnpm audit (fail on critical)
        run: |
          set +e
          pnpm audit --audit-level=critical > audit-report.txt 2>&1
          CODE=$?
          set -e
          cat audit-report.txt
          if [ "$CODE" -ne 0 ]; then
            echo "::error::Critical vulnerabilities found (pnpm audit)."
            exit "$CODE"
          fi

      - name: License validation
        run: node scripts/ci/license-check.mjs

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-${{ github.sha }}
          path: audit-report.txt
          if-no-files-found: ignore
          retention-days: 30

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified --exclude-paths=.trufflehog-exclude

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

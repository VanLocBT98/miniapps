name: Preview Deployment

on:
  pull_request:
    branches: [main, develop, 'release/**', 'hotfix/**']
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Never deploy production from feature branches — preview only.
permissions:
  contents: read
  pull-requests: write

jobs:
  detect:
    name: Detect changed apps
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      has_apps: ${{ steps.set.outputs.has_apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
        with:
          turbo-cache-key: preview-detect
      - id: set
        run: |
          RESULT=$(node scripts/ci/detect-changed-apps.mjs "origin/${{ github.base_ref }}")
          APPS=$(echo "$RESULT" | jq -c '.apps')
          echo "matrix=$APPS" >> "$GITHUB_OUTPUT"
          echo "has_apps=$(echo "$RESULT" | jq -r '(.apps | length) > 0')" >> "$GITHUB_OUTPUT"
          echo "$RESULT" | jq .

  preview:
    name: Preview · ${{ matrix.label }}
    needs: detect
    if: needs.detect.outputs.has_apps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.matrix) }}
    environment: preview
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-pnpm
        with:
          turbo-cache-key: preview-${{ matrix.id }}

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Resolve Vercel project id
        id: vercel
        env:
          VERCEL_PROJECT_MAIN: ${{ secrets.VERCEL_PROJECT_MAIN }}
          VERCEL_PROJECT_PROJECT_A: ${{ secrets.VERCEL_PROJECT_PROJECT_A }}
          VERCEL_PROJECT_PROJECT_B: ${{ secrets.VERCEL_PROJECT_PROJECT_B }}
          VERCEL_PROJECT_PROJECT_C: ${{ secrets.VERCEL_PROJECT_PROJECT_C }}
        run: |
          SECRET_NAME="${{ matrix.projectIdSecret }}"
          PROJECT_ID="${!SECRET_NAME}"
          if [ -z "$PROJECT_ID" ]; then
            echo "::error::Missing GitHub secret $SECRET_NAME"
            exit 1
          fi
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"

      - name: Resolve API URL
        id: api
        run: |
          URL="${{ vars.VITE_API_URL_STAGING }}"
          if [ -z "$URL" ]; then
            URL="https://staging-api-mini-apps.vercel.app"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Pull Vercel environment
        working-directory: ${{ matrix.rootDirectory }}
        run: |
          vercel pull --yes --environment=preview \
            --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ steps.vercel.outputs.project_id }}

      - name: Build with Vercel
        working-directory: ${{ matrix.rootDirectory }}
        run: vercel build --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ steps.vercel.outputs.project_id }}
          VITE_API_URL: ${{ steps.api.outputs.url }}
          VITE_APP_ENV: staging

      - name: Deploy preview
        id: deploy
        working-directory: ${{ matrix.rootDirectory }}
        run: |
          URL=$(vercel deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ steps.vercel.outputs.project_id }}

      - name: Collect URL
        run: |
          mkdir -p /tmp/preview-urls
          echo "${{ matrix.label }}|${{ steps.deploy.outputs.url }}" > "/tmp/preview-urls/${{ matrix.id }}.txt"

      - name: Upload preview URL fragment
        uses: actions/upload-artifact@v4
        with:
          name: preview-url-${{ matrix.id }}
          path: /tmp/preview-urls/${{ matrix.id }}.txt
          retention-days: 3

  comment:
    name: Comment preview URLs
    needs: [detect, preview]
    if: always() && needs.detect.outputs.has_apps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: preview-url-*
          path: preview-urls
          merge-multiple: true

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = 'preview-urls';
            if (!fs.existsSync(dir)) {
              console.log('No preview URLs');
              return;
            }
            const lines = fs.readdirSync(dir)
              .filter((f) => f.endsWith('.txt'))
              .map((f) => fs.readFileSync(path.join(dir, f), 'utf8').trim())
              .filter(Boolean)
              .map((line) => {
                const [label, url] = line.split('|');
                return `| ${label} | ${url} |`;
              });
            if (!lines.length) return;
            const body = [
              '## Preview Deployments',
              '',
              '| App | URL |',
              '| --- | --- |',
              ...lines,
              '',
              `_Updated for commit ${context.sha.slice(0, 7)}_`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '## Preview Deployments';
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

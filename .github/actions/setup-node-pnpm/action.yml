name: Setup Node + pnpm
description: Install Node 22, pnpm, restore caches, install deps
inputs:
  turbo-cache-key:
    description: Extra key segment for Turbo cache
    required: false
    default: default
runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11.20.0

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Restore Turbo cache
      uses: actions/cache@v4
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ inputs.turbo-cache-key }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ inputs.turbo-cache-key }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
          turbo-${{ runner.os }}-${{ inputs.turbo-cache-key }}-

services:
  postgres:
    image: postgres:16-alpine
    container_name: miniapps-postgres
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: miniapps
      POSTGRES_PASSWORD: miniapps
      POSTGRES_DB: miniapps
    volumes:
      - miniapps_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U miniapps -d miniapps']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: ['app']
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api-mini-apps.vercel.app}
        VITE_APP_ENV: production
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://miniapps:miniapps@postgres:5432/miniapps
      VITE_API_URL: ${VITE_API_URL:-https://api-mini-apps.vercel.app}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  app-dev:
    profiles: ['dev']
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      VITE_API_URL: ${VITE_API_URL:-http://host.docker.internal:3001}
      DATABASE_URL: postgresql://miniapps:miniapps@postgres:5432/miniapps
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  miniapps_pg_data:
